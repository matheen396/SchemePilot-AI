services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: schemepilot
      POSTGRES_USER: schemepilot
      POSTGRES_PASSWORD: schemepilot
    ports:
      - "5433:5432"
    volumes:
      - schemepilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemepilot -d schemepilot"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  schemepilot_pg:
